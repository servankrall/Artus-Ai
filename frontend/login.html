<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#6366f1" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Omni.Ai" />
<title>Omni.Ai — Giriş</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #30363d;
  --accent:  #6366f1;
  --text:    #e6edf3;
  --muted:   #7d8590;
  --green:   #10b981;
  --red:     #ef4444;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

.stars {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(16,185,129,0.06) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 80%, rgba(124,58,237,0.06) 0%, transparent 40%);
  animation: drift 20s ease-in-out infinite alternate;
}
@keyframes drift {
  0%   { transform: scale(1) translateY(0); }
  100% { transform: scale(1.05) translateY(-10px); }
}

.grid-overlay {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(48,54,61,0.3) 1px, transparent 1px),
    linear-gradient(90deg, rgba(48,54,61,0.3) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
}

.page {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
}

.card {
  background: rgba(22,27,34,0.9);
  border: 1px solid rgba(48,54,61,0.8);
  border-radius: 20px;
  padding: 48px 44px 40px;
  width: 100%; max-width: 420px;
  display: flex; flex-direction: column;
  align-items: center; gap: 24px;
  backdrop-filter: blur(20px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 20px 60px rgba(0,0,0,0.6),
    0 0 80px rgba(99,102,241,0.08);
}

.logo-wrap {
  display: flex; align-items: center; justify-content: center;
  width: 80px; height: 80px;
  background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(124,58,237,0.2));
  border: 1px solid rgba(99,102,241,0.4);
  border-radius: 22px;
  font-size: 38px;
  animation: logo-pulse 3s ease-in-out infinite;
}
@keyframes logo-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(99,102,241,0.3); transform: scale(1); }
  50%       { box-shadow: 0 0 35px rgba(99,102,241,0.55); transform: scale(1.04); }
}

.brand-title {
  font-size: 28px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(135deg, #e6edf3, #7d8590);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center; line-height: 1;
}
.brand-sub {
  font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px;
}

.features {
  display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
}
.feat-pill {
  padding: 5px 13px; border-radius: 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 12px; color: var(--muted);
}

.divider {
  width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}

/* ── Form ── */
.form-group {
  width: 100%;
  display: flex; flex-direction: column; gap: 6px;
}
.form-label {
  font-size: 12.5px; color: var(--muted); font-weight: 500;
}
.form-input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px; color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}
.form-input::placeholder { color: var(--muted); }

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(99,102,241,0.35);
}
.btn-primary:hover { background: #4f46e5; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.5); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.btn-secondary {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted);
  border-radius: 10px;
  padding: 11px 20px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-secondary:hover { background: rgba(255,255,255,0.07); color: var(--text); }

.btn-group { width: 100%; display: flex; flex-direction: column; gap: 9px; }

.error-msg {
  font-size: 12.5px; color: var(--red);
  text-align: center; display: none;
  padding: 8px 12px; border-radius: 8px;
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  width: 100%;
}
.error-msg.show { display: block; }

.pro-note {
  font-size: 12px; color: var(--muted);
  text-align: center; display: flex; align-items: center; gap: 5px;
}
.pro-dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  text-align: center; padding: 14px;
  font-size: 12px; color: rgba(125,133,144,0.45); z-index: 1;
}

.redirect-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.redirect-overlay.show { opacity: 1; pointer-events: all; }
</style>
</head>
<body>

<script>
/* Early auth check */
(function() {
  try {
    const u = JSON.parse(localStorage.getItem('artus_user') || 'null');
    if (u && u.email) window.location.replace('loading.html');
  } catch(_) {}
})();

/* PWA */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstall = e;
  const b = document.getElementById('btn-install-login');
  if (b) b.style.display = 'flex';
});
async function installApp() {
  if (!deferredInstall) {
    alert('Tarayıcı menüsünden "Uygulamayı yükle" seçin. iPhone: Paylaş → Ana Ekrana Ekle');
    return;
  }
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  const b = document.getElementById('btn-install-login');
  if (b) b.style.display = 'none';
}
</script>

<div class="stars"></div>
<div class="grid-overlay"></div>

<div class="page">
  <div class="card">

    <div class="logo-wrap">⚡</div>

    <div>
      <div class="brand-title">Omni.Ai</div>
      <div class="brand-sub">Dünyanın En Yetenekli Dijital Operatörü</div>
    </div>

    <div class="features">
      <span class="feat-pill">💬 Chat</span>
      <span class="feat-pill">⚡ Code</span>
      <span class="feat-pill">🎨 Design</span>
      <span class="feat-pill">🔒 Güvenli</span>
    </div>

    <div class="divider"></div>

    <div class="btn-group" style="width:100%">
      <div class="form-group">
        <label class="form-label" for="login-name">Adın</label>
        <input class="form-input" id="login-name" type="text" placeholder="Adın Soyadın" autocomplete="name" />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-email">E-posta adresi</label>
        <input class="form-input" id="login-email" type="email" placeholder="ornek@mail.com" autocomplete="email"
          onkeydown="if(event.key==='Enter') doLogin()" />
      </div>

      <div id="error-msg" class="error-msg"></div>

      <button class="btn-primary" id="btn-login" onclick="doLogin()">⚡ Giriş Yap</button>
      <button class="btn-secondary" id="btn-install-login" onclick="installApp()" style="display:none;border-color:rgba(99,102,241,0.4);color:var(--accent)">
        ⚡ Uygulamayı Cihaza Yükle
      </button>
    </div>

    <div class="pro-note">
      <span class="pro-dot"></span>
      Pro üyeler tüm özelliklere erişebilir
    </div>

  </div>
</div>

<div class="footer">© 2025 Omni.Ai — Artus AI. Tüm hakları saklıdır.</div>

<div class="redirect-overlay" id="redirect-overlay">
  <div style="text-align:center;">
    <div style="font-size:40px;animation:logo-pulse 1.5s ease-in-out infinite;">⚡</div>
    <div style="margin-top:12px;font-size:14px;color:var(--muted);">Yönlendiriliyor…</div>
  </div>
</div>

<script>
function doLogin() {
  const nameEl  = document.getElementById('login-name');
  const emailEl = document.getElementById('login-email');
  const name  = nameEl.value.trim();
  const email = emailEl.value.trim();

  if (!name) { showError('Lütfen adını gir.'); nameEl.focus(); return; }
  if (!email || !email.includes('@')) { showError('Geçerli bir e-posta gir.'); emailEl.focus(); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Giriş yapılıyor…';

  const user = { name, email, picture: '', pro: false };
  localStorage.setItem('artus_user', JSON.stringify(user));

  document.getElementById('redirect-overlay').classList.add('show');
  setTimeout(() => { window.location.replace('index.html'); }, 500);
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}
</script>
</body>
</html>
