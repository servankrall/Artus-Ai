<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMNI AGENT v1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --accent:   #2563eb;
      --accent-h: #1d4ed8;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --user-bg:  #1c2a3a;
      --bot-bg:   #161b22;
      --radius:   12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color .15s, color .15s;
    }
    #btn-clear:hover { border-color: var(--accent); color: var(--text); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 100%;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
    }

    .msg.user .avatar   { background: var(--accent); color: #fff; }
    .msg.bot  .avatar   { background: #21262d; color: var(--text); }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14.5px;
    }

    .msg.user .bubble { background: var(--user-bg); border-top-right-radius: 3px; }
    .msg.bot  .bubble { background: var(--bot-bg);  border: 1px solid var(--border); border-top-left-radius: 3px; }

    /* code blocks inside bubbles */
    .bubble pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
    }
    .bubble code { font-family: 'Cascadia Code', 'Fira Code', monospace; }

    /* ── Typing indicator ── */
    #typing {
      display: none;
      padding: 0 20px 4px;
      color: var(--muted);
      font-size: 13px;
    }
    #typing.visible { display: flex; align-items: center; gap: 6px; }

    .dot-bounce span {
      display: inline-block;
      width: 5px; height: 5px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot-bounce span:nth-child(2) { animation-delay: .2s; }
    .dot-bounce span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%            { transform: translateY(-5px); }
    }

    /* ── Input bar ── */
    #input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14.5px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 180px;
      overflow-y: auto;
      transition: border-color .15s;
      line-height: 1.5;
    }
    #user-input:focus   { border-color: var(--accent); }
    #user-input::placeholder { color: var(--muted); }

    #btn-send {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
      align-self: flex-end;
    }
    #btn-send:hover   { background: var(--accent-h); }
    #btn-send:active  { transform: scale(.94); }
    #btn-send:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ── Welcome screen ── */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
    }
    #welcome .icon { font-size: 48px; }
    #welcome h2 { color: var(--text); font-size: 22px; }
    #welcome p  { font-size: 14px; max-width: 420px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-name">OMNI AGENT</div>
        <div class="brand-sub">v1 · Artus AI</div>
      </div>
    </div>
    <button id="btn-clear" title="Sohbeti temizle">Temizle</button>
  </header>

  <div id="messages">
    <div id="welcome">
      <div class="icon">🤖</div>
      <h2>OMNI AGENT v1</h2>
      <p>Dünyanın en yetenekli dijital operatörü. Yazılım, yapay zeka, siber güvenlik ve daha fazlası için buradayım.</p>
    </div>
  </div>

  <div id="typing">
    <div class="dot-bounce"><span></span><span></span><span></span></div>
    OMNI AGENT yazıyor…
  </div>

  <div id="input-bar">
    <textarea
      id="user-input"
      placeholder="Mesajınızı yazın… (Enter gönderin, Shift+Enter satır atlayın)"
      rows="1"
    ></textarea>
    <button id="btn-send" title="Gönder">➤</button>
  </div>
</div>

<script>
  // ── Session ──
  const SESSION_ID = crypto.randomUUID
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now();

  // ── DOM refs ──
  const messagesEl = document.getElementById('messages');
  const welcomeEl  = document.getElementById('welcome');
  const typingEl   = document.getElementById('typing');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('btn-send');
  const clearBtn   = document.getElementById('btn-clear');

  let streaming = false;

  // ── Auto-resize textarea ──
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
  });

  // ── Enter / Shift+Enter ──
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
  clearBtn.addEventListener('click', clearChat);

  // ── Helpers ──
  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setStreaming(val) {
    streaming = val;
    sendBtn.disabled = val;
    typingEl.classList.toggle('visible', val);
  }

  function removeWelcome() {
    if (welcomeEl && welcomeEl.parentNode) {
      welcomeEl.parentNode.removeChild(welcomeEl);
    }
  }

  function appendMessage(role, text) {
    removeWelcome();
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'S' : '⚡';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  function appendBotBubble() {
    removeWelcome();
    const msg = document.createElement('div');
    msg.className = 'msg bot';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '⚡';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  function clearChat() {
    messagesEl.innerHTML = '';
    const w = document.createElement('div');
    w.id = 'welcome';
    w.innerHTML = `
      <div class="icon">🤖</div>
      <h2>OMNI AGENT v1</h2>
      <p>Dünyanın en yetenekli dijital operatörü. Yazılım, yapay zeka, siber güvenlik ve daha fazlası için buradayım.</p>
    `;
    messagesEl.appendChild(w);
  }

  // ── Send ──
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMessage('user', text);
    setStreaming(true);

    const bubble = appendBotBubble();
    let fullText = '';

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID, message: text }),
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({ detail: response.statusText }));
        bubble.textContent = `Hata: ${err.detail || response.statusText}`;
        setStreaming(false);
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          try {
            const evt = JSON.parse(raw);
            if (evt.type === 'text') {
              fullText += evt.content;
              bubble.textContent = fullText;
              scrollToBottom();
            } else if (evt.type === 'done') {
              break;
            } else if (evt.type === 'error') {
              bubble.textContent = `Hata: ${evt.content}`;
            }
          } catch (_) { /* ignore malformed */ }
        }
      }
    } catch (err) {
      bubble.textContent = `Bağlantı hatası: ${err.message}`;
    } finally {
      setStreaming(false);
      scrollToBottom();
    }
  }
</script>
</body>
</html>
