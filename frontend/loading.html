<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2563eb" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="omni.ai" />
<title>omni.ai — Yükleniyor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0d1117;
  --accent: #2563eb;
  --text:   #e6edf3;
  --muted:  #7d8590;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

.center {
  display: flex; flex-direction: column;
  align-items: center; gap: 24px;
  user-select: none;
}

/* Animated logo */
.logo-ring {
  position: relative;
  width: 100px; height: 100px;
  display: flex; align-items: center; justify-content: center;
}

.logo-ring::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--accent);
  border-right-color: rgba(37,99,235,0.4);
  animation: spin 1.2s linear infinite;
}

.logo-ring::after {
  content: '';
  position: absolute; inset: 8px;
  border-radius: 50%;
  border: 1px solid transparent;
  border-bottom-color: rgba(37,99,235,0.3);
  animation: spin-rev 2s linear infinite;
}

@keyframes spin     { to { transform: rotate(360deg); } }
@keyframes spin-rev { to { transform: rotate(-360deg); } }

.logo-icon {
  font-size: 38px;
  animation: icon-pulse 2s ease-in-out infinite;
  position: relative; z-index: 1;
}
@keyframes icon-pulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(37,99,235,0.5)); }
  50%       { transform: scale(1.08); filter: drop-shadow(0 0 16px rgba(37,99,235,0.8)); }
}

/* Brand text */
.brand-name {
  font-size: 20px; font-weight: 800;
  letter-spacing: 3px;
  background: linear-gradient(135deg, #e6edf3 0%, #7d8590 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.brand-sub {
  font-size: 12px; color: var(--muted);
  letter-spacing: 1px;
  margin-top: -18px;
  text-align: center;
}

/* Progress bar */
.progress-wrap {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 3px;
  background: rgba(255,255,255,0.05);
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), rgba(37,99,235,0.6));
  width: 0%;
  transition: width 0.05s linear;
  box-shadow: 0 0 8px rgba(37,99,235,0.8);
}

/* Dots */
.loading-dots {
  display: flex; gap: 6px;
  align-items: center;
}
.loading-dots span {
  display: inline-block;
  width: 5px; height: 5px;
  background: var(--muted);
  border-radius: 50%;
  animation: dot-bounce 1.2s infinite ease-in-out;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
  40%            { transform: translateY(-6px); opacity: 1; }
}
</style>
</head>
<body>

<div class="center">
  <div class="logo-ring">
    <div class="logo-icon">⚡</div>
  </div>
  <div class="brand-name">omni.ai</div>
  <div class="brand-sub">by Artus AI</div>
  <div class="loading-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar"></div>
</div>

<script>
/* ── Service worker kaydı (PWA / kurulabilir uygulama) ── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

/* ── Animate progress bar over 1.5s ── */
const bar = document.getElementById('progress-bar');
const START = Date.now();
const DURATION = 1500;

function tick() {
  const elapsed = Date.now() - START;
  const pct = Math.min((elapsed / DURATION) * 100, 100);
  bar.style.width = pct + '%';
  if (elapsed < DURATION) {
    requestAnimationFrame(tick);
  }
}
requestAnimationFrame(tick);

/* ── After 1.5s, check auth and redirect ── */
setTimeout(() => {
  try {
    const user = JSON.parse(localStorage.getItem('artus_user') || 'null');
    if (user && user.email) {
      window.location.replace('index.html');
    } else {
      window.location.replace('login.html');
    }
  } catch(_) {
    window.location.replace('login.html');
  }
}, DURATION);
</script>
</body>
</html>
