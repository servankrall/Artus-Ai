[build]
  publish = "frontend"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/pro-status"
  to = "/.netlify/functions/pro-status"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Service worker, HTML ve config dosyaları asla cache'lenmesin —
# böylece her ziyarette en güncel sürüm gelir
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/omni-config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
